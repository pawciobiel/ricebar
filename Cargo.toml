[package]
name = "ricebar"
version = "0.1.0"
edition = "2024"
description = "A configurable Wayland status bar built with iced"
license = "MIT"
repository = "https://github.com/pawciobiel/ricebar"
keywords = ["wayland", "statusbar", "layer-shell", "iced", "hyprland"]
categories = ["gui"]
readme = "README.md"
# Installed with `cargo install --git`, not from crates.io: publishing there
# means signing in through GitHub and granting that login access it does not
# need. The metadata above stays accurate either way, and this stops an
# accidental `cargo publish` rather than a deliberate one.
publish = false
# dev/scripts/ ships: the binary embeds it and writes it out on first run.
# The rest of dev/ is for working on ricebar, and docs/ holds the README's
# recordings, which have no business in a package.
exclude = ["/docs", "/dev/*.conf", "/dev/*.kdl"]

[dependencies]
# `image` and `svg` are what let an icon be a picture on disk rather than a
# font glyph. They pull in decoders and resvg, which is most of ricebar's
# compile time -- worth it, since a bar people rice is a bar whose icons they
# want to choose.
# `advanced` is what exposes widget operations, which is the only way to ask
# where a module ended up: iced reports no geometry to `update`.
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
iced_layershell = "0.19.1"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }
