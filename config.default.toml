# ricebar — written on first run. Edit freely; ricebar never rewrites it.
#
# Every option is documented in config.example.toml, shipped with the source.
#
# A module runs only if it is named in one of the modules-* lists below, so
# deleting "clock" from modules-center removes the clock. The lists were filled
# in from what this machine actually had when the file was written: anything
# commented out is missing a program or a piece of hardware, and saying so is
# more useful than a row of warning triangles.

[bar]
position = "top"
height = 32
spacing = 8
padding = 8
vertical-align = "center"

# Name a Nerd Font or the icons below render as empty boxes. Check yours with
# `fc-list : family | grep -i nerd`, and pick another with `fc-match "<name>"`.
font = "JetBrainsMono Nerd Font"
font-size = 16

# @MODULES@

[bar.style]
# #rgb, #rgba, #rrggbb and #rrggbbaa all work.
background = "#1e1e2e"
foreground = "#cdd6f4"
accent = "#89b4fa"        # fill behind the focused item
muted = "#45475a"         # fill behind an active but unfocused item
dim = "#6c7086"           # text of an empty item
urgent = "#f38ba8"        # wants attention, e.g. today in the calendar
# Tooltips, menus and popups. Unset takes `background`; alpha here makes them
# see-through without touching the bar.
#
#   popup-background = "#1e1e2ed9"
border-color = "#89b4fa"
border-width = 0
border-radius = 0
# How big a picture icon is drawn. Glyphs ignore this and follow font-size,
# because a picture has no font to take its size from.
icon-size = 18

# --- built-in modules ---------------------------------------------------
#
# Icons can be pictures rather than glyphs. Anything in an `icons` list that
# looks like a path -- it has a "/" in it, or starts with "~" -- is loaded as a
# file; svg, png and jpeg all work. Everything else is text, so a Nerd Font
# glyph, a word and an emoji are all still fine.
#
# An svg named *-symbolic.svg is recoloured to follow the module's colours, the
# freedesktop convention for a monochrome icon. Any other svg keeps the colours
# it was drawn with, and a png always does.
#
# The commented lines below use icons from a standard theme -- Adwaita, Papirus
# and Breeze all carry these names. Uncomment one to try it, and if nothing
# appears, ricebar says on stderr which file it could not find. To see what is
# installed:
#
#   ls /usr/share/icons/
#   find /usr/share/icons/Adwaita -name 'weather-clear*'

[module.clock]
format = "%Y-%m-%d %H:%M:%S"
interval = 1
tooltip-format = "%A, %-d %B %Y"   # what hovering shows
calendar = true                    # what clicking opens
week-numbers = true
weeks-pos = "right"
start-monday = true
# Run when a day is clicked; {} becomes the date as 2026-08-23, already quoted.
# Point it at a calendar, a script, anything: the notification is only a
# placeholder that makes the feature obvious.
on-click-day = "notify-send ricebar {}"

[module.workspaces]
show-empty = true
# auto | hyprland | sway | niri | none. `auto` reads the environment, which is
# ambiguous in a nested session — name one to settle it.
compositor = "auto"

# The keyboard layout in use. Click it for a list of the layouts you configured,
# and click one of those to switch. Configured but not shown: with a single
# layout there is nothing to switch to, so add "keyboard" to one of the
# modules-* lists above only if you set up more than one.
[module.keyboard]
format = "{icon} {value}"
icon = "\uf11c"       # a keyboard
short = true          # "PL" rather than "Polish", from xkb's own list
compositor = "auto"
background = "#313244"

# {icon} and {value}; drop {value} for an icon on its own. `colors` picks the
# text colour by level, lowest first, the same way `icons` picks the glyph.
[module.cpu]
format = "{icon} {value}"
colors = ["#a6e3a1", "#f9e2af", "#f38ba8"]
interval = 2
background = "#313244"
# A picture instead of the built-in glyph. Symbolic, so it still turns amber
# and red with load like the glyph does:
# icons = ["/usr/share/icons/Adwaita/symbolic/status/processor-symbolic.svg"]

[module.memory]
format = "{icon} {value}"
colors = ["#a6e3a1", "#f9e2af", "#f38ba8"]
interval = 5
background = "#313244"

[module.temperature]
format = "{icon} {value}"
interval = 5
background = "#313244"
foreground = "#f9e2af"

[module.battery]
format = "{icon} {value}"
interval = 10
background = "#313244"
foreground = "#a6e3a1"
# A ramp of pictures: lowest charge first, as with glyphs. Any length works --
# the level is spread across however many are listed.
# icons = [
#     "/usr/share/icons/Adwaita/symbolic/status/battery-level-0-symbolic.svg",
#     "/usr/share/icons/Adwaita/symbolic/status/battery-level-30-symbolic.svg",
#     "/usr/share/icons/Adwaita/symbolic/status/battery-level-60-symbolic.svg",
#     "/usr/share/icons/Adwaita/symbolic/status/battery-level-100-symbolic.svg",
# ]

[module.backlight]
format = "{icon} {value}"
interval = 5
background = "#313244"
# Turn the wheel over the module to change it. brightnessctl needs either the
# video group or its setuid helper.
on-scroll-up = "brightnessctl set +5%"
on-scroll-down = "brightnessctl set 5%-"

# --- script modules -----------------------------------------------------
#
# A custom module is up to three scripts: `exec` for what it shows, `tooltip`
# for hover, `on-click` for a click. Any may be left out. These were copied to
# @SCRIPTS@ on first run, and are yours to edit.

# No `exec` at all — a label and an action, which is how you get a start-menu
# button. rofi is told where to appear so it opens under the button.
[[module.custom]]
name = "launcher"
label = "\uf009"
tooltip = "Applications"
on-click = "rofi -show drun -location 1 -yoffset 32 -xoffset 4"

# A popup built by a script: it prints a JSON list of labels and commands, and
# ricebar draws it on its own layer-shell surface. This one lists open windows
# and works out the compositor by itself.
[[module.custom]]
name = "windows"
label = "\uf2d2"
tooltip = "Open windows"
popup = "@SCRIPTS@/windows-popup.py"

# `stream = true` keeps the command running and reads a line each time it
# prints, rather than re-running it on a timer. This one blocks inside
# `pactl subscribe`, so an idle machine costs nothing at all. The script
# reports a percentage and `icons` turns it into a glyph, so the look stays
# here in the config rather than in the script.
[[module.custom]]
name = "volume"
exec = "@SCRIPTS@/volume.sh"
stream = true
icons = ["\uf026", "\uf027", "\uf028"]
format = "{icon} {value}"
on-click = "pavucontrol"
on-scroll-up = "pactl set-sink-volume @DEFAULT_SINK@ +5%"
on-scroll-down = "pactl set-sink-volume @DEFAULT_SINK@ -5%"
background = "#313244"

# Wi-Fi: the radio's state and the signal, with a popup to turn it on or off,
# scan and join a network.
#
# The two halves need different things. `exec` reads `ip` and `iw`, so what the
# bar shows is the same under iwd, wpa_supplicant or NetworkManager. `popup`
# drives iwd through iwctl, and needs no root because iwd's D-Bus policy admits
# the wheel and netdev groups.
#
# On another backend, write your own popup and name it here instead: it has
# only to print {"items": [{"label": ..., "exec": ...}]}. Or delete the `popup`
# line and give the module an `on-click` that opens the tool you already use.
#
# The `network` module below names whichever interface holds the default route.
# This one is about the radio, so it keeps to a glyph and puts the SSID on hover.
[[module.custom]]
name = "wifi"
exec = "@SCRIPTS@/wifi.sh"
stream = true
popup = "@SCRIPTS@/wifi-popup.py"
# The Mono variant for the glyph: the wifi icons are drawn to fill the cell in
# the proportional build, so they overflow the fill behind them by a few pixels
# on the right. Mono scales them to one cell, which centres them.
font = "JetBrainsMono Nerd Font Mono"
# 20 rather than the bar's 16: Mono scales an icon to one cell, and the wifi
# wedge is a wide, short shape, so at 16 it came out half the height of the
# Bluetooth glyph beside it. The module shows no text, so this only sizes the
# icon.
font-size = 20
# Grey when off, normal when on but not joined, blue when associated.
colors = ["#6c7086", "#cdd6f4", "#89b4fa"]
background = "#313244"

# Bluetooth: the adapter's state, with whatever is connected named on hover and
# a popup to turn it on or off and connect a paired device. Pairing is left to a real
# application -- it needs an agent to answer the passkey prompt -- so the last
# line of the popup opens one.
#
# BlueZ will not power the adapter on while the radio is rfkill-blocked, and
# only root can lift that: `rfkill unblock bluetooth`, once.
[[module.custom]]
name = "bluetooth"
exec = "@SCRIPTS@/bluetooth.sh"
stream = true
popup = "@SCRIPTS@/bluetooth-popup.py"
# Grey when off, normal when on, blue when something is connected -- picked by
# the percentage the script reports.
colors = ["#6c7086", "#cdd6f4", "#89b4fa"]
background = "#313244"

# The microphone, streamed the same way. This one picks its own glyph rather
# than taking one from `icons`, because muted is not a level: an `icons` list is
# indexed by percentage, so a quiet microphone would be drawn as a muted one.
# Clicking toggles mute, and the wheel changes the recording level.
[[module.custom]]
name = "microphone"
exec = "@SCRIPTS@/microphone.sh"
stream = true
on-click = "pactl set-source-mute @DEFAULT_SOURCE@ toggle"
on-scroll-up = "pactl set-source-volume @DEFAULT_SOURCE@ +5%"
on-scroll-down = "pactl set-source-volume @DEFAULT_SOURCE@ -5%"
background = "#313244"

# Also streamed: the script sleeps between fetches, so ricebar starts one
# process instead of forking every interval. Without LOCATION, wttr.in guesses
# from your IP address, which tends to mean wherever your ISP terminates it —
# set it to a real place: LOCATION='Lublin,Poland'
#
# Set ICONS and the condition picks a picture instead of a glyph. A few were
# written to the directory below on first run, so this works as it stands --
# point it at an icon theme's status directory to use that instead, since the
# names are the freedesktop ones:
#
#   exec = "ICONS=/usr/share/icons/Adwaita/symbolic/status @SCRIPTS@/weather.py"
[[module.custom]]
name = "weather"
exec = "ICONS=@ICONS@ @SCRIPTS@/weather.py"
stream = true
tooltip = "Fetching weather..."

# --- not enabled by default ---------------------------------------------

# A ticker. Content wider than `scroll-width` characters scrolls past a window
# of that width. A second row is where something too wide for a status bar
# belongs — uncomment this and the [[bar.row]] pair above it to use it.
#
# [[module.custom]]
# name = "ticker"
# exec = "@SCRIPTS@/ticker.sh"
# stream = true
# scroll-width = 46
# scroll-speed = 6

# Markets: stock indices from Yahoo and zloty rates from the Polish central
# bank, neither of which needs an API key. Individual company quotes come from
# finnhub, which does:
#
#   printf '%s\n' 'YOUR_KEY' > ~/.config/ricebar/finnhub.token
#   chmod 600 ~/.config/ricebar/finnhub.token
#
# then set SYMBOLS below. See the header of the script for the rest.
#
# [[module.custom]]
# name = "stocks"
# exec = "FX='USD EUR' @SCRIPTS@/stocks.py"
# stream = true
# scroll-width = 46
# scroll-speed = 6

# Network: link state, SSID and address, from iproute2 and iw.
#
# [[module.custom]]
# name = "network"
# exec = "@SCRIPTS@/network.sh"
# interval = 5

# A menu shows a label and opens a list of commands when clicked. This one is
# left out of modules-right on purpose: the entries below really do power the
# machine off, and the right commands depend on your init system and lock
# screen. Check them, then add "power" to a modules-* list.
#
# [[module.menu]]
# name = "power"
# label = "⏻"
# items = [
#     { label = "\U000F033E  Lock", exec = "hyprlock" },
#     { label = "\U000F04B2  Suspend", exec = "loginctl suspend" },
#     { label = "\U000F0709  Reboot", exec = "reboot" },
#     { label = "\U000F0425  Shutdown", exec = "poweroff" },
# ]
