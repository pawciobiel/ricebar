# ricebar — copy to ~/.config/ricebar/config.toml
#
# A module runs only if it is named in one of the modules-* lists below.
# Remove "clock" from modules-center and the clock is gone.

[bar]
position = "top"          # top | bottom
height = 32
margin = [0, 0, 0, 0]     # top, right, bottom, left
exclusive = true          # reserve the space so windows cannot cover the bar
spacing = 8               # gap between modules
padding = 8               # gap between modules and the bar's edge

modules-left = ["workspaces"]
modules-center = ["clock"]
modules-right = ["memory"]

[bar.style]
# #rgb, #rgba, #rrggbb and #rrggbbaa all work.
background = "#1e1e2e"
foreground = "#cdd6f4"
accent = "#89b4fa"        # fill behind the focused item
muted = "#45475a"         # fill behind an active but unfocused item
dim = "#6c7086"           # text of an empty item
border-color = "#89b4fa"
border-width = 0
border-radius = 0

[module.clock]
format = "%Y-%m-%d %H:%M:%S"
tooltip-format = "%A, %-d %B %Y"   # shown on hover
interval = 1                       # seconds

[module.workspaces]
show-empty = true

# Custom modules run a shell command and show its output. This is how to add
# a module without writing any Rust.
#
# A command may print plain text, or a JSON object with "text" and an optional
# "tooltip". Anything that fails prints "!" with the reason in its tooltip.

[[module.custom]]
name = "memory"
exec = '''free -m | awk '/^Mem:/ {printf "{\"text\":\"%.0f%%\",\"tooltip\":\"%d MiB of %d MiB used\"}", $3/$2*100, $3, $2}' '''
interval = 5

# The simplest possible form: plain text, with a fixed tooltip.
