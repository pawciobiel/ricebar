# ricebar — copy to ~/.config/ricebar/config.toml
#
# A module runs only if it is named in one of the modules-* lists below.
# Remove "clock" from modules-center and the clock is gone.

[bar]
position = "top"          # top | bottom
height = 32
margin = [0, 0, 0, 0]     # top, right, bottom, left
exclusive = true          # reserve the space so windows cannot cover the bar
spacing = 8               # gap between modules
padding = 8               # gap between modules and the bar's edge
vertical-align = "center" # where modules sit in the bar's height: top | center | bottom

# Font family as fontconfig names it. List them with `fc-list : family`, and
# check one with `fc-match "<name>" family`. Leave it unset to use the system
# default. Name a Nerd Font if any module shows icon glyphs, otherwise they
# render only if the system happens to fall back to one.
#
# A name fontconfig does not know is substituted silently, so if text turns up
# in the wrong face, check the name with fc-match before suspecting ricebar.
font = "JetBrainsMono Nerd Font"
font-size = 16

# One row is just the three modules-* lists:
#
#   modules-left = ["workspaces"]
#   modules-center = ["clock"]
#   modules-right = ["battery"]
#
# Use [[bar.row]] instead and the bar grows a line per entry, each with its own
# left, centre and right, and its own height. The reserved space grows with it,
# so windows still sit below the whole thing.
[[bar.row]]
modules-left = ["launcher", "windows", "workspaces"]
modules-center = ["clock"]
modules-right = ["volume", "microphone", "cpu", "memory", "temperature", "backlight", "battery", "power"]

[[bar.row]]
height = 24
modules-left = ["weather"]
modules-center = ["ticker"]
modules-right = ["kernel"]

[bar.style]
# #rgb, #rgba, #rrggbb and #rrggbbaa all work.
background = "#1e1e2e"
foreground = "#cdd6f4"
accent = "#89b4fa"        # fill behind the focused item
muted = "#45475a"         # fill behind an active but unfocused item
dim = "#6c7086"           # text of an empty item
urgent = "#f38ba8"        # wants attention, e.g. today in the calendar
border-color = "#89b4fa"
border-width = 0
border-radius = 0

[module.clock]
format = "%Y-%m-%d %H:%M:%S"
interval = 1                       # seconds

# Hover and click are separate. `tooltip-format` is what hovering shows;
# `calendar` is what clicking opens. Either can be used without the other.
tooltip-format = "%A, %-d %B %Y"
calendar = true                    # click the clock for a month view
week-numbers = true                # ISO week numbers beside the grid
weeks-pos = "right"                # which side they sit on: left | right
start-monday = true                # false starts weeks on Sunday

# Run when a day is clicked. `{}` becomes the date in ISO form (2026-08-22),
# already quoted for the shell; without it the date is appended.
#
# This one only shows a notification, so it is safe to leave on and obvious
# when it fires. Swap it for whatever should happen instead:
#
#   on-click-day = "~/bin/agenda.py {}"
#   on-click-day = "thunderbird -calendar -showdate {}"
#   on-click-day = "khal list {} {}"
on-click-day = "notify-send ricebar {}"

[module.workspaces]
show-empty = true
# auto | hyprland | sway | niri | none. `auto` follows the environment, which is
# ambiguous in a nested session: a sway session started inside Hyprland
# inherits HYPRLAND_INSTANCE_SIGNATURE, so both look present. Name one to
# settle it.
compositor = "auto"

# Custom modules run a shell command and show its output. This is how to add
# a module without writing any Rust.
#
# A command may print plain text, or a JSON object with "text" and an optional
# "tooltip". Anything that fails prints "!" with the reason in its tooltip.

# A module is up to three scripts: `exec` for what it shows, `tooltip` for
# hover, `on-click` for what a click does. Any of them may be left out.
#
# This one has no `exec` at all -- just a label and an action, which is how you
# get a start-menu button. rofi is told where to appear so it opens under the
# button rather than mid-screen.
[[module.custom]]
name = "launcher"
label = "\uf009"
tooltip = "Applications"
on-click = "rofi -show drun -location 1 -yoffset 32 -xoffset 4"

# A streaming module. `stream = true` keeps the command running and reads a
# line each time it prints, instead of re-running it on a timer: this one
# blocks inside `pactl subscribe` and prints the moment the volume moves, so an
# idle machine costs nothing at all.
#
# `percentage` in its JSON picks the glyph from `icons`, lowest first, so the
# script reports a number and the look stays in config.
#
# Copy dev/scripts/volume.sh to ~/.config/ricebar/scripts/ first.
[[module.custom]]
name = "volume"
exec = "~/.config/ricebar/scripts/volume.sh"
stream = true
icons = ["\uf026", "\uf027", "\uf028"]
format = "{icon} {value}"
on-click = "pavucontrol"
on-scroll-up = "pactl set-sink-volume @DEFAULT_SINK@ +5%"
on-scroll-down = "pactl set-sink-volume @DEFAULT_SINK@ -5%"
background = "#313244"

# The microphone. Unlike volume above, this one picks its own glyph instead of
# taking one from `icons` -- muted is not a level, and an `icons` list is
# indexed by percentage, so a quiet microphone would be drawn as a muted one.
# Both glyphs can still be changed, from the command rather than the config:
#
#   exec = "ON='(o)' OFF='(x)' ~/.config/ricebar/scripts/microphone.sh"
#
# Copy dev/scripts/microphone.sh to ~/.config/ricebar/scripts/ first.
[[module.custom]]
name = "microphone"
exec = "~/.config/ricebar/scripts/microphone.sh"
stream = true
on-click = "pactl set-source-mute @DEFAULT_SOURCE@ toggle"
on-scroll-up = "pactl set-source-volume @DEFAULT_SOURCE@ +5%"
on-scroll-down = "pactl set-source-volume @DEFAULT_SOURCE@ -5%"
background = "#313244"

# Weather, streamed: the script sleeps between fetches and prints a line each
# time, so ricebar starts one process instead of forking every interval. Its
# icon is a Nerd Font weather glyph chosen from the condition text.
#
# Copy dev/scripts/weather.sh to ~/.config/ricebar/scripts/ first. Set
# LOCATION in the command for a specific city; without one wttr.in guesses.
[[module.custom]]
name = "weather"
exec = "LOCATION=Warsaw ~/.config/ricebar/scripts/weather.sh"
stream = true
tooltip = "Fetching weather..."

# A popup built by a script. Clicking runs `popup`, which prints
#
#   {"items": [{"label": "shown in the popup", "exec": "run when chosen"}]}
#
# and ricebar draws it on its own layer-shell surface. The bar knows nothing
# about what is in the list -- this one happens to be open windows, and the
# script works out which compositor is running by itself.
#
# Copy dev/scripts/windows-popup.py to ~/.config/ricebar/scripts/ first.
[[module.custom]]
name = "windows"
label = "\uf2d2"
tooltip = "Open windows"
popup = "~/.config/ricebar/scripts/windows-popup.py"

# Markets. Indices and zloty rates need no key at all, so this works as it
# stands. Individual company quotes come from finnhub, which does need one:
# set SYMBOLS and put a key in a file of its own rather than here -- see the
# header of dev/scripts/stocks.sh:
#
#   printf '%s\n' 'YOUR_KEY' > ~/.config/ricebar/finnhub.token
#   chmod 600 ~/.config/ricebar/finnhub.token
#
# Then add "stocks" to a row's modules. Until the key exists it says so
# rather than failing quietly.
#
# FX rates come from the Polish central bank instead, which needs no key --
# finnhub's forex endpoint is paid. Set FX='' to leave them out.
# [[module.custom]]
# name = "stocks"
# exec = "SYMBOLS='AAPL MSFT NVDA' FX='USD EUR' ~/.config/ricebar/scripts/stocks.sh"
#
# Indices default to SP500 DOW NASDAQ FTSE NIKKEI DAX WIG, written as
# label=symbol; override with INDICES='DAX=^GDAXI WIG=WIG.WA' or turn them off
# with INDICES=' ' (a space -- an empty value falls back to the default).
# stream = true
# scroll-width = 46
# scroll-speed = 6

# A ticker. Content longer than `scroll-width` characters is scrolled past a
# window of that width, wrapping through a separator -- the second row is where
# something too wide for a status bar belongs. Character-stepped rather than
# pixel-smooth, so a monospace font looks best.
[[module.custom]]
name = "ticker"
exec = "~/.config/ricebar/scripts/ticker.sh"
stream = true
scroll-width = 46
scroll-speed = 6

# The simplest possible module: one command, plain text, a fixed tooltip.
[[module.custom]]
name = "kernel"
exec = "uname -r"
interval = 3600
tooltip = "Running kernel"

# Readouts from the kernel: cpu, memory, temperature, battery, backlight.
# `format` takes {icon} and {value}; drop {value} for an icon on its own, the
# way waybar's do. `background` fills behind just that module, so each can be
# tinted differently. `icons` overrides the built-in Nerd Font set, lowest
# level first.

[module.cpu]
format = "{icon} {value}"
# Text colour by level, chosen the same way as icons: fine, busy, struggling.
colors = ["#a6e3a1", "#f9e2af", "#f38ba8"]
interval = 2
background = "#313244"

[module.memory]
format = "{icon} {value}"
# Text colour by level, chosen the same way as icons: fine, busy, struggling.
colors = ["#a6e3a1", "#f9e2af", "#f38ba8"]
interval = 5
background = "#313244"

[module.temperature]
format = "{icon} {value}"
interval = 5
background = "#313244"
foreground = "#f9e2af"

[module.backlight]
format = "{icon} {value}"
interval = 5
background = "#313244"
# Turn the wheel over the module to change it. brightnessctl needs either the
# video group or its setuid helper.
on-scroll-up = "brightnessctl set +5%"
on-scroll-down = "brightnessctl set 5%-"

[module.battery]
format = "{icon} {value}"
interval = 10
background = "#313244"
foreground = "#a6e3a1"

# A menu module shows a label and opens a list of commands when clicked.
# Clicking an entry runs it and closes the menu; clicking the label again just
# closes it. Labels use TOML's \U escapes so the file stays plain ASCII --
# ⏻ is the power symbol, and the entry icons are Nerd Font glyphs.
#
# These entries really do power the machine off. Change them before use.
[[module.menu]]
name = "power"
label = "⏻"
# `tooltip` is optional and off unless set. A menu says what it is when opened,
# so hover text mostly gets in the way.
items = [
    { label = "\U000F033E  Lock", exec = "hyprlock" },
    { label = "\U000F04B2  Suspend", exec = "doas zzz" },
    { label = "\U000F0709  Reboot", exec = "doas reboot" },
    { label = "\U000F0425  Shutdown", exec = "doas poweroff" },
]

