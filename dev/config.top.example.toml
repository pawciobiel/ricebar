# ricebar — top bar. The bottom one is bottom.toml, started separately.

[bar]
position = "top"
height = 28
exclusive = true
spacing = 8
padding = 8
vertical-align = "center"
font = "JetBrainsMono Nerd Font"
font-size = 16

modules-left = ["launcher", "keybindings", "windows", "workspaces", "keyboard", "stocks"]
modules-center = ["clock", "weather"]
modules-right = [
    "bluetooth",
    "wifi",
    "network",
    "volume",
    "cpu",
    "memory",
    "temperature",
    "backlight",
    "battery",
    "power",
]

[bar.style]
background = "#1e1e2e"
foreground = "#cdd6f4"
accent = "#89b4fa"
muted = "#45475a"
dim = "#6c7086"
urgent = "#f38ba8"
popup-background = "#1e1e2ed9"   # tooltips, menus and popups, a little see-through
border-color = "#89b4fa"
border-width = 0
border-radius = 0

[module.clock]
format = "%a %d %b  %H:%M"
tooltip-format = "%A, %-d %B %Y"
interval = 1
calendar = true
week-numbers = true
weeks-pos = "right"
start-monday = true
on-click-day = "notify-send ricebar {}"

[module.workspaces]
show-empty = true
compositor = "auto"

# The layout in use, and a click for the list of the rest. `short` reads xkb's
# own table, so "Polish" is drawn as PL with nothing written here for it.
[module.keyboard]
format = "{icon} {value}"
icon = "\uf11c"
short = true
compositor = "auto"
background = "#313244"

[module.cpu]
format = "{icon} {value}"
# fine, busy, struggling -- picked by how high the reading is
colors = ["#a6e3a1", "#f9e2af", "#f38ba8"]
interval = 2
background = "#313244"

[module.memory]
format = "{icon} {value}"
# fine, busy, struggling -- picked by how high the reading is
colors = ["#a6e3a1", "#f9e2af", "#f38ba8"]
interval = 5
background = "#313244"

[module.temperature]
format = "{icon} {value}"
# fine, busy, struggling -- picked by how high the reading is
colors = ["#a6e3a1", "#f9e2af", "#f38ba8"]
interval = 5
background = "#313244"

[module.backlight]
format = "{icon} {value}"
interval = 5
background = "#313244"
on-scroll-up = "brightnessctl set +5%"
on-scroll-down = "brightnessctl set 5%-"

[module.battery]
format = "{icon} {value}"
interval = 10
background = "#313244"
foreground = "#a6e3a1"

# Start menu.
[[module.custom]]
name = "launcher"
label = ""
tooltip = "Applications"
on-click = "rofi -show drun -location 1 -yoffset 56 -xoffset 4"

# Keybindings, through the rofi script already used for this. rofi has a search
# box, which ricebar's own popups do not, so this stays rofi's job.
[[module.custom]]
name = "keybindings"
# U+F0633, the command symbol: the plain keyboard now means the layout.
label = "\U000F0633"
tooltip = "Key bindings"
on-click = "~/.config/hypr/scripts/show_key_bindings.sh"

# Window switcher, drawn by ricebar from what the script prints.
[[module.custom]]
name = "windows"
label = ""
tooltip = "Open windows"
popup = "~/.config/ricebar/scripts/windows-popup.py"

# Wi-Fi: the radio and the signal, with a popup to toggle it, scan and join.
# The bar half reads `ip` and `iw` and suits any backend; the popup drives iwd
# through iwctl, so on another one name a popup script of your own here.
# `network` below names whichever interface holds the default route; this one is
# about the radio, so it keeps to a glyph with the SSID on hover.
[[module.custom]]
name = "wifi"
exec = "~/.config/ricebar/scripts/wifi.sh"
stream = true
popup = "~/.config/ricebar/scripts/wifi-popup.py"
# The Mono variant for the glyph: the wifi icons are drawn to fill the cell in
# the proportional build, so they overflow the fill behind them by a few pixels
# on the right. Mono scales them to one cell, which centres them.
font = "JetBrainsMono Nerd Font Mono"
# 20 rather than the bar's 16: Mono scales an icon to one cell, and the wifi
# wedge is a wide, short shape, so at 16 it came out half the height of the
# Bluetooth glyph beside it. The module shows no text, so this only sizes the
# icon.
font-size = 20
colors = ["#6c7086", "#cdd6f4", "#89b4fa"]
background = "#313244"

# Bluetooth: the adapter's state, with what is connected named on hover and a
# popup to toggle it and connect a paired device. Pairing needs an agent to answer the passkey
# prompt, so the popup's last line opens blueman for that.
[[module.custom]]
name = "bluetooth"
exec = "~/.config/ricebar/scripts/bluetooth.sh"
stream = true
popup = "~/.config/ricebar/scripts/bluetooth-popup.py"
# Grey when off, normal when on, blue when something is connected -- picked by
# the percentage the script reports.
colors = ["#6c7086", "#cdd6f4", "#89b4fa"]
background = "#313244"

[[module.custom]]
name = "network"
exec = "~/.config/ricebar/scripts/network.sh"
stream = true
on-click = "nm-connection-editor"

[[module.custom]]
name = "volume"
exec = "~/.config/ricebar/scripts/volume.sh"
stream = true
icons = ["", "", ""]
format = "{icon} {value}"
on-click = "pavucontrol"
on-scroll-up = "pactl set-sink-volume @DEFAULT_SINK@ +5%"
on-scroll-down = "pactl set-sink-volume @DEFAULT_SINK@ -5%"
background = "#313244"

# Markets, scrolling past a fixed window so a long feed fits beside the
# workspaces. Quotes need ~/.config/ricebar/finnhub.token; the indices and the
# zloty rates need no key.
[[module.custom]]
name = "stocks"
exec = "SYMBOLS='AAPL MSFT NVDA' FX='USD EUR' ~/.config/ricebar/scripts/stocks.py"
stream = true
scroll-width = 28
scroll-speed = 3

[[module.custom]]
name = "weather"
exec = "LOCATION=Lublin,Poland ~/.config/ricebar/scripts/weather.py"
stream = true
tooltip = "Fetching weather..."

[[module.menu]]
name = "power"
label = "⏻"
items = [
    { label = "\U000F033E  Lock", exec = "hyprlock" },
    { label = "\U000F04B2  Suspend", exec = "doas zzz" },
    { label = "\U000F0709  Reboot", exec = "doas reboot" },
    { label = "\U000F0425  Shutdown", exec = "doas poweroff" },
]
