# A minimal sway session for developing ricebar's sway backend, run nested
# inside whatever compositor you are already using. See TODO.md.
#
#   WLR_BACKENDS=wayland sway --config dev/sway-nested.conf

set $mod Mod4

# A picture rather than a flat colour: against a solid background the same
# shade as the bar, the bar looks like it fills the whole window. This one
# ships with sway itself, so it is there wherever sway is.
output * bg /usr/share/backgrounds/sway/Sway_Wallpaper_Blue_1920x1080.png fill #1e1e2e

# Do not fight the host compositor for drag bindings.
floating_modifier $mod normal

# Two layouts, so the keyboard module has something to switch between.
input type:keyboard {
    xkb_layout "us,pl"
    xkb_options "grp:alt_shift_toggle"
}

bindsym $mod+Return exec alacritty
bindsym $mod+q kill
bindsym $mod+Shift+e exit

# Several workspaces, so the workspaces module has something to show.
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
