# A sway session for recording ricebar, run nested inside whatever compositor
# you are already using. Driven by dev/record/record.sh, which is what should
# be run -- see the header there.
#
# Nothing is bound to a key: every action in a recording is synthesised through
# `swaymsg seat - cursor`, so a take is reproducible and does not need anyone
# to hold the mouse still.

# A picture rather than a flat colour: against a solid background the same
# shade as the bar, the bar looks like it fills the whole window.
output * resolution 1280x720 bg /usr/share/backgrounds/sway/Sway_Wallpaper_Blue_1920x1080.png fill

# Thin, quiet window decoration: the bar is the subject, not sway.
default_border pixel 2
client.focused          #89b4fa #89b4fa #1e1e2e #89b4fa #89b4fa
client.unfocused        #45475a #45475a #cdd6f4 #45475a #45475a
client.focused_inactive #45475a #45475a #cdd6f4 #45475a #45475a
gaps inner 12
gaps outer 4

# The cursor has to be visible in a hover shot, and big enough to read once the
# capture is scaled down.
seat * xcursor_theme default 32
seat * hide_cursor 0
